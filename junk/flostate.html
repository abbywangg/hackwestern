<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowState - Presage Integration</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        /* --- GRAIN & TEXTURE SYSTEM --- */
        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.35;
            filter: url(#noiseFilter);
            mix-blend-mode: overlay;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f0f9ff; }
        ::-webkit-scrollbar-thumb { background: #93c5fd; border-radius: 4px; }

        .font-script { font-family: 'Pacifico', cursive; }
        .font-mono { font-family: 'Space Mono', monospace; }
        .font-sans { font-family: 'Inter', sans-serif; }

        /* --- ANIMATIONS --- */
        @keyframes blob-bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-blob {
            animation: blob-bounce 3s infinite ease-in-out;
        }

        @keyframes glide-up {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-glide {
            animation: glide-up 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes deep-breath {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
        }
        .animate-breath {
            animation: deep-breath 6s infinite ease-in-out;
        }

        /* Pacer Animation for Breathing Intervention */
        @keyframes pacer-expand {
            0% { transform: scale(0.85); opacity: 0.7; }
            40% { transform: scale(1.15); opacity: 1; } /* Inhale */
            60% { transform: scale(1.15); opacity: 1; } /* Hold */
            100% { transform: scale(0.85); opacity: 0.7; } /* Exhale */
        }
        .animate-pacer {
            animation: pacer-expand 8s infinite ease-in-out;
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in {
            animation: fade-in 0.5s ease-out;
        }

        .custom-checkbox:checked {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }
        .custom-checkbox:checked + label {
            text-decoration: line-through;
            color: #94a3b8;
        }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 h-screen overflow-hidden selection:bg-blue-200 selection:text-blue-900">

    <svg style="display: none;">
        <filter id="noiseFilter">
            <feTurbulence type="fractalNoise" baseFrequency="0.80" numOctaves="3" stitchTiles="stitch"/>
        </filter>
    </svg>

    <div class="grain-overlay"></div>
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICONS ---
        const Clock = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        );
        const Heart = ({ size = 24, className = "", fill = "none" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
        );
        const CheckCircle = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        );
        const Plus = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        );
        const Trash = ({ size = 24, className = "" }) => (
             <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        );
        const Edit = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        );

        // --- UTILS: COLOR INTERPOLATION ---
        // Porting the Python 'Decade' logic to JS
        const ANCHORS = [
            { bpm: 60,  hex: "#4B0082" }, // Deep Purple
            { bpm: 65,  hex: "#0000FF" }, // Blue
            { bpm: 70,  hex: "#00FF00" }, // Green
            { bpm: 80,  hex: "#FFFF00" }, // Yellow
            { bpm: 90,  hex: "#FFA500" }, // Orange
            { bpm: 100, hex: "#FF4500" }, // Red-Orange
            { bpm: 110, hex: "#FF0000" }  // Bright Red
        ];

        const hexToRgb = (hex) => {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        };

        const componentToHex = (c) => {
            const hex = Math.round(c).toString(16);
            return hex.length == 1 ? "0" + hex : hex;
        };

        const rgbToHex = (r, g, b) => "#" + componentToHex(r) + componentToHex(g) + componentToHex(b);

        const getSpectrumColor = (bpm) => {
            if (bpm <= 60) return "#4B0082";
            if (bpm >= 110) return "#FF0000";

            // Find which two anchors we are between
            let lower = ANCHORS[0];
            let upper = ANCHORS[ANCHORS.length - 1];

            for (let i = 0; i < ANCHORS.length - 1; i++) {
                if (bpm >= ANCHORS[i].bpm && bpm <= ANCHORS[i+1].bpm) {
                    lower = ANCHORS[i];
                    upper = ANCHORS[i+1];
                    break;
                }
            }

            // Interpolate
            const range = upper.bpm - lower.bpm;
            const progress = (bpm - lower.bpm) / range;
            
            const lowerRgb = hexToRgb(lower.hex);
            const upperRgb = hexToRgb(upper.hex);

            const r = lowerRgb.r + (upperRgb.r - lowerRgb.r) * progress;
            const g = lowerRgb.g + (upperRgb.g - lowerRgb.g) * progress;
            const b = lowerRgb.b + (upperRgb.b - lowerRgb.b) * progress;

            return rgbToHex(r, g, b);
        };

        // --- PAGE 1: LANDING PAGE ---
        const LandingPage = ({ onStart }) => {
            return (
                <div className="h-full flex flex-col items-center justify-center relative z-10 animate-fade-in">
                    <div className="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-200/50 rounded-full mix-blend-multiply filter blur-[100px] animate-blob"></div>
                    <div className="absolute bottom-1/4 right-1/4 w-96 h-96 bg-cyan-200/50 rounded-full mix-blend-multiply filter blur-[100px] animate-blob" style={{animationDelay: '2s'}}></div>

                    <div className="flex flex-col items-center z-20 animate-glide">
                        <div className="animate-breath mb-8">
                            <h1 className="text-[120px] md:text-[150px] font-script text-blue-600 drop-shadow-sm leading-tight" 
                                style={{ textShadow: '4px 4px 0px rgba(191, 219, 254, 0.5)' }}>
                                flow.state
                            </h1>
                        </div>
                        <p className="font-sans text-slate-500 text-lg mb-12 tracking-wide max-w-md text-center leading-relaxed">
                            Find your rhythm. The concentration creativity biometric app.
                        </p>
                        <button onClick={onStart} className="group relative px-10 py-4 bg-white border border-blue-100 rounded-full shadow-xl shadow-blue-100 hover:shadow-blue-200 hover:scale-105 transition-all duration-300 overflow-hidden">
                            <div className="absolute inset-0 bg-gradient-to-r from-blue-50 to-cyan-50 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                            <span className="relative font-mono text-blue-600 font-bold uppercase tracking-widest text-sm flex items-center gap-2">
                                Start Flow <span className="group-hover:translate-x-1 transition-transform">→</span>
                            </span>
                        </button>
                    </div>
                </div>
            );
        };

        // --- PAGE 2: TRACKING DASHBOARD ---
        const DashboardView = () => {
            const [activeTab, setActiveTab] = useState('main');
            const [bpm, setBpm] = useState(60);
            const [studyTime, setStudyTime] = useState(45);
            const [flowState, setFlowState] = useState('INIT'); 
            const [orbColor, setOrbColor] = useState("#4B0082");
            const [intervention, setIntervention] = useState(false);

            // Student Data
            const [todos, setTodos] = useState([
                { id: 1, text: 'Read Chapter 4: Cognitive Flow', completed: false },
                { id: 2, text: 'Outline Research Paper', completed: true },
            ]);
            const [newTodo, setNewTodo] = useState('');
            const [notes, setNotes] = useState('Hypothesis: Flow state is achieved when challenge meets skill...\n\nKey Concepts:\n- Autotelic experience');

            // --- HEART RATE SIMULATION & LOGIC ---
            useEffect(() => {
                const interval = setInterval(() => {
                    setBpm(prev => {
                        // Simulate a wider range to test color spectrum
                        // Drifting up and down
                        const noise = Math.floor(Math.random() * 7) - 2; 
                        let newBpm = prev + noise;
                        
                        // Bounds for simulation: 55 (Low) to 115 (High) to test all colors
                        if (newBpm < 55) newBpm = 55; 
                        if (newBpm > 115) newBpm = 115;
                        return newBpm;
                    });
                }, 2000);
                return () => clearInterval(interval);
            }, []);

            // Presage Logic Implementation
            useEffect(() => {
                // 1. Calculate Color
                const newColor = getSpectrumColor(bpm);
                setOrbColor(newColor);

                // 2. Determine Flow State (75 < x < 95)
                const FLOW_MIN = 75;
                const FLOW_MAX = 95;
                const inFlow = bpm > FLOW_MIN && bpm < FLOW_MAX;

                setIntervention(!inFlow);
                setFlowState(inFlow ? "FLOW STATE" : "BREATHE");

            }, [bpm]);

            // Helper for Todos
            const addTodo = (e) => {
                e.preventDefault();
                if (!newTodo.trim()) return;
                setTodos([...todos, { id: Date.now(), text: newTodo, completed: false }]);
                setNewTodo('');
            };
            const toggleTodo = (id) => setTodos(todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
            const deleteTodo = (id) => setTodos(todos.filter(t => t.id !== id));

            const TabButton = ({ id, label }) => {
                const isActive = activeTab === id;
                return (
                    <button onClick={() => setActiveTab(id)} className={`relative px-6 py-2 md:px-8 md:py-3 font-mono font-bold text-xs md:text-sm tracking-wider uppercase transition-all duration-300 rounded-full ${isActive ? 'text-white shadow-lg shadow-blue-200 bg-blue-600' : 'text-slate-400 hover:text-blue-500 hover:bg-blue-50'}`}>
                        {label}
                    </button>
                );
            };

            return (
                <div className="flex flex-col h-full max-w-7xl mx-auto relative animate-fade-in">
                    {/* Background Ambient Glow based on Orb Color */}
                    <div className="absolute top-0 right-0 w-96 h-96 rounded-full mix-blend-multiply filter blur-[120px] opacity-10 transition-colors duration-1000" style={{ backgroundColor: orbColor }}></div>
                    <div className="absolute bottom-0 left-0 w-96 h-96 rounded-full mix-blend-multiply filter blur-[120px] opacity-10 transition-colors duration-1000" style={{ backgroundColor: orbColor }}></div>

                    {/* HEADER */}
                    <div className="flex flex-col md:flex-row justify-between items-end px-10 pt-10 pb-6 border-b border-slate-200 z-10 bg-white/30 backdrop-blur-sm">
                        <div className="flex flex-col max-w-2xl">
                            <h1 className="text-4xl font-script text-blue-600 drop-shadow-sm pb-2" style={{ textShadow: '2px 2px 0px rgba(191, 219, 254, 0.5)' }}>flow.state</h1>
                             <p className="font-sans text-xs md:text-sm text-slate-500 font-medium leading-relaxed mt-1">
                                Monitor: <span className="font-mono font-bold" style={{color: orbColor}}>{intervention ? "INTERVENTION" : "OPTIMAL"}</span>
                            </p>
                        </div>
                        <div className="flex space-x-2 mt-4 md:mt-0 bg-white/50 p-1 rounded-full border border-slate-200">
                            <TabButton id="main" label="Home" />
                            <TabButton id="planner" label="Planner" />
                            <TabButton id="stats" label="Stats" />
                        </div>
                    </div>

                    {/* CONTENT AREA */}
                    <div className="flex flex-1 p-10 gap-10 overflow-hidden relative z-10">
                        
                        {/* MAIN TAB */}
                        {activeTab === 'main' && (
                            <>
                                {/* Timer Panel */}
                                <div className="w-1/5 flex flex-col gap-6 animate-fade-in">
                                    <div className="bg-white/70 backdrop-blur-md border border-white/50 rounded-2xl p-6 flex-1 flex flex-col items-center shadow-xl shadow-slate-200 relative overflow-hidden">
                                        <div className="w-full flex items-center justify-between text-slate-400 mb-6">
                                            <Clock size={20} />
                                            <span className="font-mono text-xs font-bold uppercase tracking-widest">Timer</span>
                                        </div>
                                        <div className="relative flex-1 w-16 bg-slate-100 rounded-full overflow-hidden border border-slate-200 inner-shadow">
                                            <div className="absolute bottom-0 w-full transition-all duration-500 opacity-80" style={{ height: `${(studyTime / 120) * 100}%`, backgroundColor: orbColor }}></div>
                                            <input type="range" min="0" max="120" orient="vertical" value={studyTime} onChange={(e) => setStudyTime(parseInt(e.target.value))} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" style={{ WebkitAppearance: 'slider-vertical' }} />
                                        </div>
                                        <div className="text-center mt-6">
                                            <div className="text-5xl font-mono font-bold text-slate-700 tracking-tighter">{studyTime}</div>
                                            <div className="text-xs font-mono text-slate-400 uppercase mt-1">Minutes</div>
                                        </div>
                                    </div>
                                </div>

                                {/* The Presage Orb Panel */}
                                <div className="flex-1 bg-white/60 backdrop-blur-xl border border-white/60 rounded-[3rem] shadow-2xl shadow-slate-200 relative flex flex-col items-center justify-center p-12 overflow-hidden animate-fade-in">
                                    
                                    {/* INTERVENTION OVERLAY */}
                                    {intervention && (
                                        <div className="absolute top-10 z-30 animate-fade-in">
                                            <h3 className="text-xl font-mono font-bold text-slate-600 bg-white/80 px-6 py-2 rounded-full border border-slate-200 shadow-sm">
                                                BREATHE IN... BREATHE OUT
                                            </h3>
                                        </div>
                                    )}

                                    <div className="relative z-10">
                                        {/* Back Glow */}
                                        <div className={`absolute inset-0 transform scale-150 blur-3xl opacity-40 transition-all duration-1000 rounded-full ${intervention ? 'animate-pacer' : 'animate-blob'}`} style={{ backgroundColor: orbColor }}></div>
                                        
                                        {/* Main Orb */}
                                        <div className={`w-80 h-80 rounded-full shadow-2xl flex items-center justify-center relative overflow-hidden transition-all duration-1000 border-4 border-white/30 ${intervention ? 'animate-pacer' : ''}`}
                                             style={{ background: `linear-gradient(180deg, ${orbColor} 0%, rgba(255,255,255,0.2) 100%)` }}>
                                            
                                            {/* Noise Texture */}
                                            <div className="absolute inset-0 opacity-20 mix-blend-overlay" style={{ backgroundImage: `url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E")` }}></div>
                                            
                                            {/* Ping Ring (Only in Flow) */}
                                            {!intervention && (
                                                <div className="absolute inset-0 border border-white/40 rounded-full animate-ping" style={{ animationDuration: `${60000/bpm}ms` }}></div>
                                            )}

                                            <div className="text-center text-white z-20 mix-blend-plus-lighter drop-shadow-lg">
                                                <h2 className="text-8xl font-script mb-1">flow</h2>
                                                <div className="flex items-center justify-center gap-3 mt-2">
                                                    <Heart className={`animate-pulse`} size={24} fill="currentColor" />
                                                    <div className="font-mono text-4xl font-bold tracking-tighter">{bpm}</div>
                                                </div>
                                                <div className="font-mono text-[10px] uppercase tracking-[0.3em] opacity-90 mt-1">Live BPM</div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Bottom Legend */}
                                    <div className="absolute bottom-12 left-0 w-full px-20">
                                        <div className="grid grid-cols-3 gap-4 border-t border-slate-200 pt-6">
                                            <div className="text-center">
                                                <p className="font-mono text-[10px] text-slate-400 uppercase tracking-widest mb-1">State</p>
                                                <p className="font-bold text-xl text-slate-600" style={{ color: orbColor }}>{flowState}</p>
                                            </div>
                                            <div className="text-center border-l border-r border-slate-200">
                                                <p className="font-mono text-[10px] text-slate-400 uppercase tracking-widest mb-1">Focus</p>
                                                <p className="font-bold text-xl text-slate-600">{intervention ? "Low" : "High"}</p>
                                            </div>
                                            <div className="text-center">
                                                <p className="font-mono text-[10px] text-slate-400 uppercase tracking-widest mb-1">Session</p>
                                                <div className="flex items-center justify-center gap-2">
                                                    <div className="w-2 h-2 rounded-full animate-pulse" style={{ backgroundColor: orbColor }}></div>
                                                    <span className="font-bold text-xl text-slate-600">Active</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </>
                        )}

                        {/* PLANNER TAB */}
                        {activeTab === 'planner' && (
                             <div className="flex-1 flex gap-8 animate-fade-in">
                                <div className="w-1/3 bg-white/70 backdrop-blur-md border border-white/50 rounded-3xl p-8 shadow-xl shadow-slate-200 flex flex-col">
                                    <div className="flex items-center justify-between mb-6">
                                        <div className="flex items-center gap-2 text-blue-600">
                                            <CheckCircle size={20} />
                                            <h3 className="font-mono font-bold uppercase tracking-widest text-sm">Tasks</h3>
                                        </div>
                                        <span className="text-xs font-bold bg-blue-100 text-blue-600 px-2 py-1 rounded-md">{todos.filter(t => t.completed).length}/{todos.length}</span>
                                    </div>
                                    <div className="flex-1 overflow-y-auto pr-2 space-y-3">
                                        {todos.map(todo => (
                                            <div key={todo.id} className="group flex items-center gap-3 bg-white/50 p-3 rounded-xl border border-transparent hover:border-blue-200 transition-all">
                                                <input type="checkbox" checked={todo.completed} onChange={() => toggleTodo(todo.id)} className="w-5 h-5 rounded-md border-2 border-slate-300 text-blue-600 focus:ring-blue-500 custom-checkbox cursor-pointer" id={`todo-${todo.id}`} />
                                                <label htmlFor={`todo-${todo.id}`} className={`flex-1 text-sm font-sans font-medium cursor-pointer select-none transition-colors ${todo.completed ? 'text-slate-400 line-through' : 'text-slate-700'}`}>{todo.text}</label>
                                                <button onClick={() => deleteTodo(todo.id)} className="text-slate-300 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity"><Trash size={16} /></button>
                                            </div>
                                        ))}
                                    </div>
                                    <form onSubmit={addTodo} className="mt-4 pt-4 border-t border-blue-100 flex gap-2">
                                        <input type="text" value={newTodo} onChange={(e) => setNewTodo(e.target.value)} placeholder="Add task..." className="flex-1 bg-white/80 border border-slate-200 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-blue-400" />
                                        <button type="submit" className="bg-blue-600 text-white p-2 rounded-xl hover:bg-blue-700"><Plus size={20} /></button>
                                    </form>
                                </div>
                                <div className="flex-1 bg-white/70 backdrop-blur-md border border-white/50 rounded-3xl p-8 shadow-xl shadow-slate-200 flex flex-col relative overflow-hidden">
                                     <div className="flex items-center gap-2 text-blue-600 mb-4"><Edit size={20} /><h3 className="font-mono font-bold uppercase tracking-widest text-sm">Notes</h3></div>
                                    <div className="absolute inset-0 pointer-events-none opacity-20" style={{ backgroundImage: 'linear-gradient(#e2e8f0 1px, transparent 1px)', backgroundSize: '100% 2rem', marginTop: '5rem' }}></div>
                                    <textarea value={notes} onChange={(e) => setNotes(e.target.value)} className="flex-1 w-full bg-transparent border-none resize-none focus:ring-0 text-slate-700 font-sans text-lg leading-8 p-2 outline-none z-10 placeholder-slate-300"></textarea>
                                </div>
                            </div>
                        )}

                        {/* STATS TAB */}
                        {activeTab === 'stats' && (
                            <div className="flex-1 flex items-center justify-center animate-fade-in">
                                <div className="bg-white/70 backdrop-blur-md border border-white/50 rounded-3xl p-12 shadow-xl shadow-slate-200 text-center">
                                    <h3 className="font-mono font-bold text-blue-600 uppercase tracking-widest mb-4">Weekly Analytics</h3>
                                    <div className="text-6xl font-script text-slate-300 mb-4">Coming Soon</div>
                                    <p className="text-slate-500">Flow history accumulating...</p>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [currentView, setCurrentView] = useState('landing');
            return (
                <>
                    {currentView === 'landing' && <LandingPage onStart={() => setCurrentView('dashboard')} />}
                    {currentView === 'dashboard' && <DashboardView />}
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
